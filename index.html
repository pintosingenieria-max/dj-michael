<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Panel – Michael</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #f0e6e6;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      background-image: radial-gradient(circle at 10% 30%, #1a0a0f 0%, #0d0d0d 80%);
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .neon-text { color: #f7c2d9; text-shadow: 0 0 12px #f7c2d9, 0 0 30px #ff69b4, 0 0 60px #ff1493; }
    .gold-text { color: #ffd700; text-shadow: 0 0 10px #ffd700, 0 0 25px #ff8c00; }
    h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; }
    h2 { font-size: 1.6rem; border-left: 4px solid #ff69b4; padding-left: 0.75rem; margin-bottom: 1.5rem; font-weight: 700; color: #ffd700; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0.5rem 0 1.5rem 0;
      border-bottom: 2px solid #ff69b4;
      margin-bottom: 2rem;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { font-size: 2.5rem; }
    .badge { background: #1a0a0f; padding: 0.4rem 1.2rem; border-radius: 40px; border: 1.5px solid #ffd700; font-size: 0.8rem; font-weight: 700; color: #ffd700; }
    .card {
      background: rgba(20,10,15,0.85);
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 1.8rem 2rem;
      margin-bottom: 2.5rem;
      border: 1px solid #3a1a2a;
      box-shadow: 0 8px 40px rgba(255,105,180,0.15);
      border-top: 3px solid #ffd700;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-item {
      background: rgba(30,15,22,0.6);
      border-radius: 16px;
      padding: 1rem;
      text-align: center;
      border: 1px solid #4a2a3a;
    }
    .stat-item .label { font-size: 0.9rem; color: #d0b0b0; }
    .stat-item .count { font-size: 2rem; font-weight: 700; color: #ffd700; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    thead { background: #2a1a22; color: #ffd700; }
    th, td { padding: 0.7rem 1rem; text-align: left; border-bottom: 1px solid #2a1a22; }
    tr:hover { background: rgba(255,105,180,0.05); }
    .badge-style { display: inline-block; background: #4a2a3a; padding: 0.2rem 0.8rem; border-radius: 40px; font-size: 0.8rem; }
    .empty-msg { color: #6a4a5a; text-align: center; padding: 2rem 0; font-style: italic; }
    .refresh-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      color: #8a6a7a;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #2a1a22;
      border: 1px solid #4a2a3a;
      color: #f0e0e0;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .btn-primary { background: #ff69b4; border-color: #ff69b4; color: #0d0d0d; }
    .btn-primary:hover { background: #ff1493; border-color: #ff1493; transform: scale(1.05); }
    .btn-outline { background: transparent; border-color: #5a3a4a; }
    .btn-outline:hover { border-color: #ffd700; color: #ffd700; }
    .btn-sm { padding: 0.25rem 0.8rem; font-size: 0.75rem; }
    @media (max-width: 768px) {
      body { padding: 0.8rem; }
      h1 { font-size: 2rem; }
      .card { padding: 1.2rem 1rem; }
      .stats-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      table { font-size: 0.8rem; }
      th, td { padding: 0.4rem 0.6rem; }
    }
    @media (max-width: 480px) { .header { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <span class="logo-icon">🎛️</span>
        <h1 class="neon-text">DJ Panel</h1>
        <span class="badge">📊 En vivo</span>
      </div>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <span style="color:#8a6a7a; font-size:0.9rem;">Actualización cada 3s</span>
        <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 Forzar</button>
      </div>
    </header>

    <section class="card">
      <h2>📈 Conteo por estilo</h2>
      <div id="statsContainer" class="stats-grid"></div>
    </section>

    <section class="card">
      <h2>📋 Lista de votos</h2>
      <div class="refresh-info">
        <span>Última actualización: <span id="lastUpdate">—</span></span>
        <span>Total de votos: <span id="totalVotes">0</span></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Nombre</th><th>Estilo</th><th>Fecha/Hora</th></tr></thead>
          <tbody id="votesTableBody"><tr><td colspan="4" class="empty-msg">Cargando datos...</td></tr></tbody>
        </table>
      </div>
    </section>

    <div style="text-align:center; color:#6a4a5a; font-size:0.8rem; padding:1rem 0; border-top:1px solid #2a1a22; margin-top:1rem;">
      <span style="color:#ffb6c1;">DJ Michael — Panel de control</span>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================================================
      // 1. CONFIGURACIÓN FIREBASE
      // ============================================================
      const FIREBASE_URL = 'https://michael-dj-default-rtdb.europe-west1.firebasedatabase.app/';
      const VOTOS_PATH = 'votos.json';

      // ============================================================
      // 2. ESTILOS (para mapeo)
      // ============================================================
      const STYLES = [
        { id: 'r1', label: '🔥 Reggaeton' },
        { id: 'r2', label: '🎶 Cumbia' },
        { id: 'r3', label: '💃 Funk' },
        { id: 'r4', label: '🇧🇷 Sertanejo' },
        { id: 'r5', label: '🎛️ Remixes / Electrónica' },
        { id: 'r6', label: '🕺 Retro / Pop' },
        { id: 'r7', label: '🎺 Banda / Grupera' },
        { id: 'r8', label: '🌴 Vallenato' },
        { id: 'r9', label: '💔 Baladas / Villeras' },
        { id: 'r10', label: '🎤 Pop Latino' },
        { id: 'r11', label: '🎧 Urbano / Trap' },
        { id: 'r12', label: '🎹 Clásicos 80/90' }
      ];

      // ============================================================
      // 3. DOM REFS
      // ============================================================
      const statsContainer = document.getElementById('statsContainer');
      const votesTableBody = document.getElementById('votesTableBody');
      const lastUpdateSpan = document.getElementById('lastUpdate');
      const totalVotesSpan = document.getElementById('totalVotes');
      const refreshBtn = document.getElementById('refreshBtn');

      // ============================================================
      // 4. FUNCIONES
      // ============================================================
      function fetchVotes() {
        fetch(FIREBASE_URL + VOTOS_PATH)
          .then(res => {
            if (!res.ok) throw new Error('Error en la respuesta');
            return res.json();
          })
          .then(data => {
            renderData(data);
            lastUpdateSpan.textContent = new Date().toLocaleTimeString();
          })
          .catch(err => {
            console.error('Error al obtener datos:', err);
            votesTableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">Error al cargar datos. Verifica conexión.</td></tr>`;
          });
      }

      function renderData(data) {
        // Si data es null o undefined, no hay votos
        if (!data) {
          votesTableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">No hay votos registrados aún.</td></tr>`;
          updateStats({});
          totalVotesSpan.textContent = '0';
          return;
        }

        // Determinar si los datos son una lista de votos (con pushId) o un objeto de contadores
        // Si al menos una clave contiene un objeto con 'nombre' y 'estilo', es lista de votos.
        let isVoteList = false;
        const keys = Object.keys(data);
        if (keys.length > 0) {
          const firstVal = data[keys[0]];
          if (firstVal && typeof firstVal === 'object' && (firstVal.nombre !== undefined || firstVal.estilo !== undefined)) {
            isVoteList = true;
          }
        }

        if (isVoteList) {
          // === LISTA DE VOTOS INDIVIDUALES ===
          const entries = Object.entries(data);
          const votesArray = entries.map(([key, value]) => ({
            id: key,
            nombre: value.nombre || 'Anónimo',
            estilo: value.estilo || 'Desconocido',
            timestamp: value.timestamp || 0,
            date: value.timestamp ? new Date(value.timestamp).toLocaleString() : '—'
          }));

          votesArray.sort((a, b) => b.timestamp - a.timestamp);

          if (votesArray.length === 0) {
            votesTableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">No hay votos registrados aún.</td></tr>`;
          } else {
            let html = '';
            votesArray.forEach((v, i) => {
              html += `<tr><td>${i+1}</td><td><strong>${escapeHtml(v.nombre)}</strong></td><td><span class="badge-style">${escapeHtml(v.estilo)}</span></td><td>${v.date}</td></tr>`;
            });
            votesTableBody.innerHTML = html;
          }

          // Calcular estadísticas por estilo
          const stats = {};
          votesArray.forEach(v => {
            const estilo = v.estilo;
            stats[estilo] = (stats[estilo] || 0) + 1;
          });
          updateStats(stats);
          totalVotesSpan.textContent = votesArray.length;
        } else {
          // === OBJETO DE CONTADORES (ej: {cumbia:13, reggaeton:7}) ===
          // Mostrar mensaje de que no hay nombres
          votesTableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">Los datos están en formato de contadores (sin nombres). Usa la página de votación para registrar votos individuales.</td></tr>`;
          // Mostrar contadores en estadísticas
          const stats = {};
          STYLES.forEach(style => {
            const label = style.label;
            // Buscar en data una clave que coincida (normalizada)
            const key = label.replace(/[^a-z0-9]/gi, '').toLowerCase();
            let count = 0;
            for (const [dbKey, val] of Object.entries(data)) {
              if (dbKey.toLowerCase() === key || dbKey === label) {
                count = val;
                break;
              }
            }
            stats[label] = count;
          });
          updateStats(stats);
          const total = Object.values(data).reduce((a,b) => a + (typeof b === 'number' ? b : 0), 0);
          totalVotesSpan.textContent = total;
        }
      }

      function updateStats(stats) {
        let html = '';
        STYLES.forEach(style => {
          const count = stats[style.label] || 0;
          html += `<div class="stat-item"><div class="label">${style.label}</div><div class="count">${count}</div></div>`;
        });
        statsContainer.innerHTML = html;
      }

      function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
      }

      // ============================================================
      // 5. INICIO Y POLLING
      // ============================================================
      fetchVotes();
      let interval = setInterval(fetchVotes, 3000);
      refreshBtn.addEventListener('click', () => {
        fetchVotes();
        clearInterval(interval);
        interval = setInterval(fetchVotes, 3000);
      });
      console.log('🎛️ Panel DJ conectado a Firebase.');
    })();
  </script>
</body>
</html>
